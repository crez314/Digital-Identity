# §18 로컬 개발 환경.
# postgres(pgvector) / redis / minio / crez-ml을 컨테이너로 띄우고,
# api·worker·web은 호스트에서 pnpm dev로 실행해 핫리로드를 유지한다.
name: crez-dice

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: crez
      POSTGRES_PASSWORD: crez
      POSTGRES_DB: crez
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crez"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: crezadmin
      MINIO_ROOT_PASSWORD: crezadmin
      # 저장 데이터 암호화(SSE-S3) 키 — 원본 사진을 포함한 모든 객체를 디스크에 암호화해 둔다(§15, §16, ADR 0003).
      # 개발 전용 값이다. 운영 S3는 버킷 기본 암호화(SSE-KMS)를 쓰고 키를 저장소에 두지 않는다.
      # 이 값을 바꾸거나 잃으면 기존 객체를 읽을 수 없다.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-crez-dev-sse:jsAeWGGLp7VU35u/GrDtjwp02vXlGNUoc3uHCYbFGWw=}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 버킷 생성 + 퍼블릭 접근 차단 (§15) + 기본 암호화 (§16)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 crezadmin crezadmin &&
      mc mb --ignore-existing local/crez-media &&
      mc anonymous set none local/crez-media &&
      mc version enable local/crez-media &&
      mc encrypt set sse-s3 local/crez-media &&
      echo 'bucket ready';
      "

  ml:
    build:
      context: ../services/ml
      dockerfile: Dockerfile
    environment:
      ML_MODE: ${ML_MODE:-cpu}
      ML_INTERNAL_TOKEN: dev-internal-token
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: crez-media
      S3_ACCESS_KEY: crezadmin
      S3_SECRET_KEY: crezadmin
      S3_FORCE_PATH_STYLE: "true"
      LOG_LEVEL: INFO
    ports: ["8000:8000"]
    volumes:
      - ../services/ml/models:/app/models:ro
    depends_on:
      minio: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
